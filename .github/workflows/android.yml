name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --project-name warka_news .

      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          for path in candidates:
              if not path.exists():
                  continue
              content = path.read_text()
              pattern = re.compile(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)"
                  r"(?:flutter\.compileSdkVersion|[0-9]+)(\s*(?://.*)?$)"
              )
              updated, count = pattern.subn(r"\g<1>36\g<2>", content)
              if count:
                  path.write_text(updated)
                  print(f"Set {path} compile SDK to 36")
                  break
          else:
              raise SystemExit("Could not find an Android app compileSdk setting.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: warka-news-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
